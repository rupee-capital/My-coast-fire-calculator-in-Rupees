<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Coast FIRE App</title>
    <!-- Universal Chart.js CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --success: #16a34a;
            --success-light: #f0fdf4;
            --danger: #dc2626;
            --danger-light: #fdf2f2;
            --border: #e2e8f0;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main); 
            padding: 40px 20px; 
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04); 
        }
        .header-area {
            margin-bottom: 35px;
            text-align: center;
        }
        h1 { 
            color: var(--text-main); 
            margin: 0 0 8px 0; 
            font-size: 2.25rem; 
            font-weight: 800;
            letter-spacing: -0.025em;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin: 0;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 24px; 
            margin-bottom: 35px; 
        }
        .input-group { 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .input-group:hover {
            border-color: #cbd5e1;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 12px; 
            color: var(--text-main); 
            font-size: 0.95rem;
        }
        input[type="range"] { 
            width: 100%; 
            margin: 10px 0; 
            cursor: pointer;
            accent-color: var(--primary);
        }
        .value-disp { 
            font-weight: 700; 
            color: var(--primary); 
            float: right; 
            background: var(--primary-light);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .highlight-post { 
            grid-column: span 2; 
            background: #fffbeb; 
            border: 1px solid #fef08a;
        }
        .highlight-post .value-disp {
            color: #b45309;
            background: #fef9c3;
        }
        .post-note {
            color: #b45309; 
            display: block; 
            margin-top: 6px; 
            font-size: 0.85rem;
        }
        .results-dashboard { 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px; 
        }
        .card {
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: #f8fafc;
        }
        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 700;
        }
        .card-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
        }
        .status-card {
            grid-column: span 3;
            padding: 18px 24px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1.05rem;
            text-align: center;
        }
        .status-success {
            background: var(--success-light);
            border: 1px solid #bbf7d0;
            color: #15803d;
        }
        .status-danger {
            background: var(--danger-light);
            border: 1px solid #fecaca;
            color: #b91c1c;
        }
        .chart-container { 
            position: relative; 
            margin-top: 40px; 
            height: 400px; 
            width: 100%; 
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: #ffffff;
            box-sizing: border-box;
        }
        @media(max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .highlight-post { grid-column: span 1; }
            .results-dashboard { grid-template-columns: 1fr; }
            .status-card { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <h1>Coast FIRE Planner</h1>
        <p class="subtitle">Interactive wealth projection & dynamic retirement lifecycle simulator</p>
    </div>
    
    <div class="grid">
        <div class="input-group">
            <label>Current Age <span id="lblCurrentAge" class="value-disp">30</span></label>
            <input type="range" id="currentAge" min="18" max="70" value="30" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Target Retirement Age <span id="lblRetirementAge" class="value-disp">60</span></label>
            <input type="range" id="retirementAge" min="35" max="80" value="60" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Current Savings (₹) <span id="lblSavings" class="value-disp">2,500,000</span></label>
            <input type="range" id="savings" min="0" max="100000000" step="100000" value="2500000" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Annual Expenses Today (₹) <span id="lblExpenses" class="value-disp">600,000</span></label>
            <input type="range" id="expenses" min="100000" max="5000000" step="25000" value="600000" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Pre-Retirement Annual Return (%) <span id="lblReturns" class="value-disp">12</span></label>
            <input type="range" id="returns" min="4" max="18" step="0.5" value="12" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Expected Inflation Rate (%) <span id="lblInflation" class="value-disp">6</span></label>
            <input type="range" id="inflation" min="2" max="12" step="0.5" value="6" oninput="calculate()">
        </div>
        <div class="input-group highlight-post">
            <label style="color: #92400e;">Post-Retirement Return Rate (%) <span id="lblPostReturns" class="value-disp">6</span></label>
            <input type="range" id="postReturns" min="2" max="15" step="0.5" value="6" oninput="calculate()">
            <span class="post-note">Setting this equal to inflation simulates your safe, conservative 0% real return constraint.</span>
        </div>
    </div>

    <div class="results-dashboard">
        <div class="card">
            <div class="card-title">Required At Retirement</div>
            <div class="card-value" id="resTargetCorpus">₹0</div>
        </div>
        <div class="card">
            <div class="card-title">Coast Target Today</div>
            <div class="card-value" id="resCoastNumber">₹0</div>
        </div>
        <div class="card">
            <div class="card-title">Your Current Net Worth</div>
            <div class="card-value" id="resCurrentSavings">₹0</div>
        </div>
        <div id="resStatus" class="status-card">Calculating roadmap metrics...</div>
    </div>

    <div class="chart-container">
        <canvas id="corpusChart"></canvas>
    </div>
</div>

<script>
let chartInstance = null;

function formatRupee(num) {
    if (num >= 10000000) {
        return '₹' + (num / 10000000).toFixed(2) + ' Cr';
    } else if (num >= 100000) {
        return '₹' + (num / 100000).toFixed(2) + ' Lakh';
    }
    return '₹' + Math.round(num).toLocaleString('en-IN');
}

function calculate() {
    const currentAge = parseInt(document.getElementById('currentAge').value);
    const retirementAge = parseInt(document.getElementById('retirementAge').value);
    const currentSavings = parseFloat(document.getElementById('savings').value);
    const expensesToday = parseFloat(document.getElementById('expenses').value);
    const preReturns = parseFloat(document.getElementById('returns').value) / 100;
    const inflation = parseFloat(document.getElementById('inflation').value) / 100;
    const postReturns = parseFloat(document.getElementById('postReturns').value) / 100;

    document.getElementById('lblCurrentAge').innerText = currentAge;
    document.getElementById('lblRetirementAge').innerText = retirementAge;
    document.getElementById('lblSavings').innerText = currentSavings.toLocaleString('en-IN');
    document.getElementById('lblExpenses').innerText = expensesToday.toLocaleString('en-IN');
    document.getElementById('lblReturns').innerText = (preReturns * 100).toFixed(1);
    document.getElementById('lblInflation').innerText = (inflation * 100).toFixed(1);
    document.getElementById('lblPostReturns').innerText = (postReturns * 100).toFixed(1);

    const yearsToRetire = retirementAge - currentAge;
    const expensesAtRetirement = expensesToday * Math.pow(1 + inflation, yearsToRetire);

    let realPostRate = (1 + postReturns) / (1 + inflation) - 1;
    let targetCorpus = 0;
